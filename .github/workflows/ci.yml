name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:docs
      - name: Starter template complies with the OpenFlow Standard (build level)
        working-directory: templates/next-starter
        run: npx openflow check --level build --format sarif > openflow.sarif || (npx openflow check --level build; exit 1)
      - name: Landing page (built with OpenFlow) complies with the standard (build level)
        working-directory: sites/landing
        run: npx openflow check --level build
      - name: Plugin and marketplace valid for Claude Code (official validator)
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate --strict plugins/openflow
          sh -n plugins/openflow/scripts/openflow-hook.sh
          sh -n plugins/openflow/skills/openflow-new-site/scripts/openflow-init.sh
      - name: One-command setup (skill openflow-new-site) creates a compliant site
        run: |
          touch node_modules/.openflow-built
          sh plugins/openflow/skills/openflow-new-site/scripts/openflow-init.sh --site ci-smoke --name "Site de test"
          cd sites/ci-smoke && npx openflow check

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @openflow/e2e exec playwright install --with-deps chromium
      - name: Admin weight budget (login screen, starter and landing exports)
        run: |
          (cd templates/next-starter && npx openflow check --level build --build)
          (cd sites/landing && npx openflow check --level build --build)
          pnpm --filter @openflow/e2e weight ../../templates/next-starter/out --budget
          pnpm --filter @openflow/e2e weight ../../sites/landing/out --budget
      - name: Security rules + admin scenario on the Firebase emulators
        run: pnpm --filter @openflow/e2e test
      - name: Landing (editor ergonomics, AI assistant and OAuth, security rules)
        run: pnpm --filter @openflow/e2e test editor assistant rules
        env:
          CMS_E2E_SITE: ${{ github.workspace }}/sites/landing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots
          if-no-files-found: ignore
