<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Plex", sans-serif; color: white;
    background-color: var(--ink);
    background-image: linear-gradient(rgb(255 255 255 / 0.05) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 0.05) 1px, transparent 1px);
    background-size: 48px 48px; }
  .glow { position: absolute; right: -120px; top: -160px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(closest-side, rgb(47 91 255 / 0.35), transparent); }
  .brand { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 14px; font-family: "Bricolage", sans-serif; font-weight: 700; font-size: 30px; }
  .sel { position: absolute; left: 72px; top: 196px; width: 1010px; padding: 6px 4px; outline: 2px solid var(--cobalt); outline-offset: 12px; }
  .sel .h { position: absolute; width: 14px; height: 14px; background: white; border: 2px solid var(--cobalt); }
  .tag { position: absolute; left: -12px; top: -62px; background: var(--cobalt); color: white; font-weight: 600; font-size: 18px; padding: 4px 12px; border-radius: 7px; }
  h1 { font-family: "Bricolage", sans-serif; font-weight: 750; font-stretch: 88%; font-size: 76px; line-height: 0.98; letter-spacing: -0.02em; }
  .caret { display: inline-block; width: 6px; height: 64px; background: var(--cobalt); vertical-align: -6px; margin-left: 6px; }
  .foot { position: absolute; left: 72px; bottom: 58px; display: flex; gap: 14px; align-items: center; font-size: 22px; font-weight: 500; color: rgb(255 255 255 / 0.72); }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 10px; background: rgb(255 255 255 / 0.07); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14); }
  .chip.live { color: #ffb27a; box-shadow: inset 0 0 0 1px rgb(255 122 26 / 0.6); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--flame); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="brand">
  <svg viewBox="0 0 32 32" width="40" height="40" fill="none"><rect x="5" y="5" width="22" height="22" rx="2" stroke="white" stroke-width="2"/><path d="M9 20c3.2 0 3.8-8 7-8s3.8 8 7 8" stroke="#ff7a1a" stroke-width="2.4" stroke-linecap="round"/><rect x="2.5" y="2.5" width="5" height="5" fill="#2f5bff"/><rect x="24.5" y="2.5" width="5" height="5" fill="#2f5bff"/><rect x="2.5" y="24.5" width="5" height="5" fill="#2f5bff"/><rect x="24.5" y="24.5" width="5" height="5" fill="#2f5bff"/></svg>
  OpenFlow
</div>
<div class="sel">
  <span class="h" style="left:-20px;top:-20px"></span><span class="h" style="right:-20px;top:-20px"></span>
  <span class="h" style="left:-20px;bottom:-20px"></span><span class="h" style="right:-20px;bottom:-20px"></span>
  <span class="tag">Titre principal</span>
  <h1>Claude Code construit le site.<br />Votre client le modifie <span style="white-space:nowrap">lui-même.<span class="caret"></span></span></h1>
</div>
<div class="foot">
  <span class="chip">Next.js</span>
  <span class="chip">Firebase</span>
  <span class="chip">Open source</span>
  <span class="chip live"><span class="dot"></span>En ligne</span>
</div>
</body>
</html>
